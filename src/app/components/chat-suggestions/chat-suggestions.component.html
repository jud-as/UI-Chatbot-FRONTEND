<div class="suggestion-wrapper">
  <div class="suggestion-topic" *ngFor="let suggestionTopic of suggestionTopics">
    <div class="suggestion-header">
      <icon-question *ngIf="suggestionTopic.icon === 'question'"></icon-question>
      <icon-search *ngIf="suggestionTopic.icon === 'curiosity'"></icon-search>
      <icon-key *ngIf="suggestionTopic.icon === 'history'"></icon-key>
      <span>{{ suggestionTopic.title }}</span>
    </div>

    <ul class="suggestion-list">
      <li *ngFor="let question of suggestionTopic.questions">{{ question }}</li>
    </ul>
  </div>
</div>
